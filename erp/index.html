<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>KSE ERP — 이전 안내</title>
    <meta http-equiv="refresh" content="3;url=https://pkg-room-erp.vercel.app/">
    <style>
        body {
            font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #1e40af 100%);
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 20px;
        }
        .box {
            background: white; border-radius: 24px; padding: 40px 32px;
            width: 100%; max-width: 420px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo { font-size: 1.6rem; font-weight: 900; color: #1e293b; margin-bottom: 8px; }
        .logo span { color: #3b82f6; }
        h1 { font-size: 1.1rem; color: #1e293b; margin: 16px 0 8px; }
        p { font-size: 0.9rem; color: #64748b; line-height: 1.7; margin: 8px 0 24px; }
        a.btn {
            display: inline-block; background: #1e40af; color: white;
            text-decoration: none; border-radius: 12px; padding: 14px 28px;
            font-weight: 700; font-size: 1rem;
            box-shadow: 0 4px 12px rgba(30,64,175,0.25);
        }
        .hint { font-size: 0.75rem; color: #94a3b8; margin-top: 20px; }
        .footer { font-size: 0.65rem; color: #cbd5e1; margin-top: 28px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">KSE <span>ERP</span></div>
        <h1>📦 새 시스템으로 이전했습니다</h1>
        <p>이 주소(kse1970.com/erp)의 옛 ERP는 종료되었습니다.<br>
           아래 새 주소를 이용해 주세요.<br>
           <b>북마크(즐겨찾기)도 새 주소로 바꿔주세요!</b></p>
        <a class="btn" href="https://pkg-room-erp.vercel.app/">새 ERP 바로가기 →</a>
        <div class="hint">3초 후 자동으로 이동합니다…</div>
        <div class="footer">KSE 주식회사 · Since 1970</div>
    </div>
</body>
</html>
